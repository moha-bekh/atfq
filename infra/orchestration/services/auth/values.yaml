image:
  repository: ghcr.io/moha-bekh/atfq-prototype-auth
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

nodeSelector:
  node-pool: workload

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

ports:
  - name: grpc
    containerPort: 8080
  - name: metrics
    containerPort: 9091

service:
  enabled: true
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
    - name: metrics
      port: 9091
      targetPort: metrics

env:
  REDIS_URL: "redis://redis-auth.atfq-data.svc.cluster.local:6379"
  METRICS_ADDR: "0.0.0.0:9091"
  USER_SERVICE_ADDR: "http://user.atfq-apps.svc.cluster.local:8080"
  STARTUP_MAX_RETRIES: "90"
  APP_PUBLIC_URL: "https://atfq.org"
  SMTP_HOST: "mailpit.atfq-tools.svc.cluster.local"
  SMTP_PORT: "1025"
  SMTP_TLS: "false"
  SMTP_FROM: "ATFQ <noreply@atfq.org>"

envFrom:
  - secretRef:
      name: auth-runtime-env

configMaps:
  - name: auth-vault-agent-config
    data:
      agent-config.hcl: |-
        exit_after_auth = false
        pid_file = "/tmp/vault-agent-pid"

        auto_auth {
          method "approle" {
            config = {
              role_id_file_path = "/etc/vault/agent_ids/role-id"
              secret_id_file_path = "/etc/vault/agent_ids/secret-id"
              remove_secret_id_file_after_reading = false
            }
          }

          sink "file" {
            config = {
              path = "/tmp/token"
            }
          }
        }

        template {
          contents = <<EOH
        {{ with secret "secret/data/auth" }}
        DATABASE_URL="postgresql://{{ .Data.data.db_user }}:{{ .Data.data.db_password }}@db-auth.atfq-data.svc.cluster.local:5432/{{ .Data.data.db_name }}"
        SERVER_ADDR="{{ .Data.data.server_addr }}"
        JWT_SECRET="{{ .Data.data.jwt_secret }}"
        CHA_CHA_KEY="{{ .Data.data.cha_cha_key }}"
        GOOGLE_CLIENT_ID="{{ .Data.data.google_client_id }}"
        GOOGLE_CLIENT_SECRET="{{ .Data.data.google_client_secret }}"
        GOOGLE_REDIRECT_URL="{{ .Data.data.google_redirect_url }}"
        GITHUB_CLIENT_ID="{{ .Data.data.github_client_id }}"
        GITHUB_CLIENT_SECRET="{{ .Data.data.github_client_secret }}"
        GITHUB_REDIRECT_URL="{{ .Data.data.github_redirect_url }}"
        SMTP_USERNAME="{{ .Data.data.smtp_username }}"
        SMTP_PASSWORD="{{ .Data.data.smtp_password }}"
        {{ end }}
        EOH
          destination = "/vault/secrets/.env"
        }

        template {
          contents = "{{ with secret \"secret/data/auth\" }}{{ .Data.data.db_user }}{{ end }}"
          destination = "/vault/secrets/POSTGRES_USER"
        }

        template {
          contents = "{{ with secret \"secret/data/auth\" }}{{ .Data.data.db_password }}{{ end }}"
          destination = "/vault/secrets/POSTGRES_PASSWORD"
        }

        template {
          contents = "{{ with secret \"secret/data/auth\" }}{{ .Data.data.db_name }}{{ end }}"
          destination = "/vault/secrets/POSTGRES_DB"
        }

volumeMounts:
  - name: vault-secrets
    mountPath: /vault/secrets
    readOnly: true

volumes:
  - name: vault-secrets
    emptyDir:
      medium: Memory
  - name: vault-agent-config
    configMap:
      name: auth-vault-agent-config
  - name: vault-agent-ids
    secret:
      secretName: vault-agent-auth-approle

sidecars:
  - name: vault-agent
    image: hashicorp/vault:1.13.3
    securityContext:
      runAsUser: 100
      runAsGroup: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
    env:
      - name: VAULT_ADDR
        value: http://vault.atfq-data.svc.cluster.local:8200
    command: ["vault", "agent", "-config=/etc/vault/agent-config.hcl"]
    volumeMounts:
      - name: vault-agent-config
        mountPath: /etc/vault/agent-config.hcl
        subPath: agent-config.hcl
      - name: vault-agent-ids
        mountPath: /etc/vault/agent_ids
        readOnly: true
      - name: vault-secrets
        mountPath: /vault/secrets

readinessProbe:
  tcpSocket:
    port: grpc
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  tcpSocket:
    port: grpc
  initialDelaySeconds: 30
  periodSeconds: 20
