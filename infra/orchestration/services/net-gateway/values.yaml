workload:
  kind: DaemonSet

hostNetwork: true
shareProcessNamespace: true
dnsPolicy: ClusterFirstWithHostNet

image:
  repository: owasp/modsecurity-crs
  tag: nginx-alpine

nodeSelector:
  kubernetes.io/hostname: worker-01

securityContext:
  runAsUser: 0
  runAsGroup: 0

env:
  MODSEC_RULE_ENGINE: "On"
  MODSEC_AUDIT_ENGINE: "RelevantOnly"
  MODSEC_AUDIT_LOG: "/var/log/modsec_audit.log"
  MODSEC_REQ_BODY_LIMIT: "10485760"
  ALLOWED_METHODS: "GET HEAD POST OPTIONS PUT DELETE PATCH"

initContainers:
  - name: bootstrap-tls
    image: owasp/modsecurity-crs:nginx-alpine
    command:
      - sh
      - -c
      - |
        set -eu
        if [ ! -s /etc/letsencrypt/live/atfq.org/fullchain.pem ] || [ ! -s /etc/letsencrypt/live/atfq.org/privkey.pem ]; then
          mkdir -p /etc/letsencrypt/live/atfq.org
          openssl req -x509 -nodes -newkey rsa:2048 -days 3 \
            -subj "/CN=atfq.org" \
            -keyout /etc/letsencrypt/live/atfq.org/privkey.pem \
            -out /etc/letsencrypt/live/atfq.org/fullchain.pem
        fi
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    volumeMounts:
      - name: letsencrypt
        mountPath: /etc/letsencrypt
  - name: prepare-modsecurity-dir
    image: owasp/modsecurity-crs:nginx-alpine
    command: ["sh", "-c", "cp -RL /etc/modsecurity.d/. /work/. && chmod -R u+w /work"]
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    volumeMounts:
      - name: modsecurity-dir
        mountPath: /work

ports:
  - name: http
    containerPort: 80
  - name: https
    containerPort: 443

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https

configMaps:
  - name: net-gateway-nginx-config
    data:
      nginx.conf.template: |-
        load_module modules/ngx_http_modsecurity_module.so;
        load_module modules/ngx_http_headers_more_filter_module.so;

        pid /tmp/nginx.pid;

        worker_processes auto;
        events { worker_connections 1024; }

        http {
            include /etc/nginx/mime.types;

            client_body_temp_path /tmp/client_temp;
            proxy_temp_path       /tmp/proxy_temp;
            fastcgi_temp_path     /tmp/fastcgi_temp;
            uwsgi_temp_path       /tmp/uwsgi_temp;
            scgi_temp_path        /tmp/scgi_temp;

            include /etc/nginx/conf.d/*.conf;

            sendfile on;
            keepalive_timeout 65;
            client_max_body_size 10m;
            gzip on;

            upstream app { server app-nginx.atfq-apps.svc.cluster.local:8080; }
            upstream api_gateway { server api-gateway.atfq-apps.svc.cluster.local:8080; }
            upstream grafana { server grafana.atfq-observability.svc.cluster.local:3000; }
            upstream minio_user { server minio.atfq-data.svc.cluster.local:9000; }

            server {
                listen 80;
                server_name atfq.org www.atfq.org;

                location ^~ /.well-known/acme-challenge/ {
                    root /var/www/certbot;
                    default_type "text/plain";
                }

                location / {
                    return 301 https://$host$request_uri;
                }
            }

            server {
              listen 443 ssl;
              server_name atfq.org www.atfq.org;

              ssl_certificate /etc/letsencrypt/live/atfq.org/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/atfq.org/privkey.pem;

              location ^~ /auth/callback/ {
                modsecurity off;
                proxy_pass http://app;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
              }

              location /api/ {
                proxy_pass http://api_gateway;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }

              location ^~ /profiles/ {
                modsecurity off;
                proxy_pass http://minio_user;
                proxy_http_version 1.1;
                proxy_set_header Host minio.atfq-data.svc.cluster.local;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }

              location = /grafana {
                return 301 /grafana/;
              }

              location ^~ /grafana/ {
                modsecurity off;
                proxy_pass http://grafana;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Prefix /grafana;
              }

              location / {
                proxy_pass http://app;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
              }
            }
        }
volumeMounts:
  - name: nginx-config
    mountPath: /etc/nginx/templates/nginx.conf.template
    subPath: nginx.conf.template
    readOnly: true
  - name: modsecurity-dir
    mountPath: /etc/modsecurity.d
  - name: letsencrypt
    mountPath: /etc/letsencrypt
  - name: certbot-webroot
    mountPath: /var/www/certbot

volumes:
  - name: nginx-config
    configMap:
      name: net-gateway-nginx-config
  - name: modsecurity-dir
    emptyDir: {}
  - name: letsencrypt
    hostPath:
      path: /var/lib/atfq/letsencrypt
      type: DirectoryOrCreate
  - name: certbot-webroot
    emptyDir: {}

sidecars:
  - name: certbot
    image: certbot/certbot:v2.11.0
    env:
      - name: LETSENCRYPT_EMAIL
        value: admin@atfq.org
    command:
      - sh
      - -c
      - |
        while true; do
          if [ ! -f /etc/letsencrypt/renewal/atfq.org.conf ]; then
            rm -rf /etc/letsencrypt/live/atfq.org /etc/letsencrypt/archive/atfq.org
          fi
          certbot certonly --webroot \
            --webroot-path /var/www/certbot \
            --cert-name atfq.org \
            --domain atfq.org \
            --domain www.atfq.org \
            --email "$LETSENCRYPT_EMAIL" \
            --agree-tos \
            --non-interactive \
            --keep-until-expiring || true
          latest_cert="$(find /etc/letsencrypt/live -maxdepth 1 -type d -name 'atfq.org*' | sort | tail -n 1)"
          if [ -n "$latest_cert" ] && [ -s "$latest_cert/fullchain.pem" ] && [ -s "$latest_cert/privkey.pem" ]; then
            mkdir -p /etc/letsencrypt/live/atfq.org
            cp -L "$latest_cert/fullchain.pem" /etc/letsencrypt/live/atfq.org/fullchain.pem
            cp -L "$latest_cert/privkey.pem" /etc/letsencrypt/live/atfq.org/privkey.pem
          fi
          sleep 12h
        done
    volumeMounts:
      - name: letsencrypt
        mountPath: /etc/letsencrypt
      - name: certbot-webroot
        mountPath: /var/www/certbot
  - name: nginx-reloader
    image: nginx:alpine
    command:
      - sh
      - -c
      - |
        while true; do
          sleep 5m
          for pid in $(pidof nginx 2>/dev/null || true); do
            kill -HUP "$pid" 2>/dev/null || true
          done
        done
