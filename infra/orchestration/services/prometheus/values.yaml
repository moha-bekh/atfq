image:
  repository: prom/prometheus
  tag: v2.55.1

nodeSelector:
  node-pool: shared

command:
  - /bin/prometheus
  - --config.file=/etc/prometheus/prometheus.yml
  - --storage.tsdb.path=/prometheus
  - --web.console.libraries=/usr/share/prometheus/console_libraries
  - --web.console.templates=/usr/share/prometheus/consoles
  - --web.enable-lifecycle

ports:
  - name: http
    containerPort: 9090

service:
  enabled: true
  ports:
    - name: http
      port: 9090
      targetPort: http

configMaps:
  - name: prometheus-config
    data:
      prometheus.yml: |-
        global:
          scrape_interval: 15s

        scrape_configs:
          - job_name: "api-gateway"
            metrics_path: /metrics
            static_configs:
              - targets: ["api-gateway.atfq-apps.svc.cluster.local:8080"]

          - job_name: "auth"
            metrics_path: /metrics
            static_configs:
              - targets: ["auth.atfq-apps.svc.cluster.local:9091"]

          - job_name: "user"
            metrics_path: /metrics
            static_configs:
              - targets: ["user.atfq-apps.svc.cluster.local:9091"]

          - job_name: "wiki"
            metrics_path: /metrics
            static_configs:
              - targets: ["wiki.atfq-apps.svc.cluster.local:9091"]

          - job_name: "node-exporter"
            static_configs:
              - targets: ["node-exporter.atfq-observability.svc.cluster.local:9100"]

          - job_name: "cadvisor"
            metrics_path: /metrics
            static_configs:
              - targets: ["cadvisor.atfq-observability.svc.cluster.local:8080"]

          - job_name: "process-exporter"
            metrics_path: /metrics
            static_configs:
              - targets: ["process-exporter.atfq-observability.svc.cluster.local:9256"]

          - job_name: "prometheus"
            static_configs:
              - targets: ["prometheus.atfq-observability.svc.cluster.local:9090"]

persistence:
  - name: prometheus-data
    enabled: true
    size: 5Gi

volumeMounts:
  - name: prometheus-config
    mountPath: /etc/prometheus/prometheus.yml
    subPath: prometheus.yml
    readOnly: true
  - name: prometheus-data
    mountPath: /prometheus

volumes:
  - name: prometheus-config
    configMap:
      name: prometheus-config
  - name: prometheus-data
    persistentVolumeClaim:
      claimName: prometheus-data
