image:
  repository: ghcr.io/moha-bekh/atfq-prototype-user
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

nodeSelector:
  node-pool: workload

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

ports:
  - name: grpc
    containerPort: 8080
  - name: metrics
    containerPort: 9091

service:
  enabled: true
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
    - name: metrics
      port: 9091
      targetPort: metrics

env:
  METRICS_ADDR: "0.0.0.0:9091"

envFrom:
  - secretRef:
      name: user-runtime-env

configMaps:
  - name: user-vault-agent-config
    data:
      agent-config.hcl: |-
        exit_after_auth = false
        pid_file = "/tmp/vault-agent-pid"

        auto_auth {
          method "approle" {
            config = {
              role_id_file_path = "/etc/vault/agent_ids/role-id"
              secret_id_file_path = "/etc/vault/agent_ids/secret-id"
              remove_secret_id_file_after_reading = false
            }
          }

          sink "file" {
            config = {
              path = "/tmp/token"
            }
          }
        }

        template {
          contents = <<EOH
        {{ with secret "secret/data/user" }}
        DATABASE_URL="postgresql://{{ .Data.data.db_user }}:{{ .Data.data.db_password }}@db-user.atfq-data.svc.cluster.local:5432/{{ .Data.data.db_name }}"
        SERVER_ADDR="{{ .Data.data.server_addr }}"
        JWT_SECRET="{{ .Data.data.jwt_secret }}"
        S3_ENDPOINT="{{ .Data.data.s3_endpoint }}"
        S3_PUBLIC_URL="{{ .Data.data.s3_public_url }}"
        S3_BUCKET="{{ .Data.data.s3_bucket }}"
        AWS_ACCESS_KEY_ID="{{ .Data.data.aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY="{{ .Data.data.aws_secret_access_key }}"
        {{ end }}
        EOH
          destination = "/vault/secrets/.env"
        }

        template {
          contents = "{{ with secret \"secret/data/user\" }}{{ .Data.data.db_user }}{{ end }}"
          destination = "/vault/secrets/POSTGRES_USER"
        }

        template {
          contents = "{{ with secret \"secret/data/user\" }}{{ .Data.data.db_password }}{{ end }}"
          destination = "/vault/secrets/POSTGRES_PASSWORD"
        }

        template {
          contents = "{{ with secret \"secret/data/user\" }}{{ .Data.data.db_name }}{{ end }}"
          destination = "/vault/secrets/POSTGRES_DB"
        }

        template {
          contents = "{{ with secret \"secret/data/user\" }}{{ .Data.data.minio_root_user }}{{ end }}"
          destination = "/vault/secrets/MINIO_ROOT_USER"
        }

        template {
          contents = "{{ with secret \"secret/data/user\" }}{{ .Data.data.minio_root_password }}{{ end }}"
          destination = "/vault/secrets/MINIO_ROOT_PASSWORD"
        }

        template {
          contents = "{{ with secret \"secret/data/user\" }}{{ .Data.data.s3_bucket }}{{ end }}"
          destination = "/vault/secrets/S3_BUCKET"
        }

volumeMounts:
  - name: vault-secrets
    mountPath: /vault/secrets
    readOnly: true

volumes:
  - name: vault-secrets
    emptyDir:
      medium: Memory
  - name: vault-agent-config
    configMap:
      name: user-vault-agent-config
  - name: vault-agent-ids
    secret:
      secretName: vault-agent-user-approle

sidecars:
  - name: vault-agent
    image: hashicorp/vault:1.13.3
    securityContext:
      runAsUser: 100
      runAsGroup: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
    env:
      - name: VAULT_ADDR
        value: http://vault.atfq-data.svc.cluster.local:8200
    command: ["vault", "agent", "-config=/etc/vault/agent-config.hcl"]
    volumeMounts:
      - name: vault-agent-config
        mountPath: /etc/vault/agent-config.hcl
        subPath: agent-config.hcl
      - name: vault-agent-ids
        mountPath: /etc/vault/agent_ids
        readOnly: true
      - name: vault-secrets
        mountPath: /vault/secrets

readinessProbe:
  tcpSocket:
    port: grpc
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  tcpSocket:
    port: grpc
  initialDelaySeconds: 30
  periodSeconds: 20
