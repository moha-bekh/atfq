image:
  repository: ghcr.io/moha-bekh/atfq-prototype-api-gateway
  tag: latest

imagePullSecrets:
  - name: ghcr-pull-secret

nodeSelector:
  node-pool: workload

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

ports:
  - name: http
    containerPort: 8080

service:
  enabled: true
  ports:
    - name: http
      port: 8080
      targetPort: http

env:
  STARTUP_MAX_RETRIES: "90"
  AUTH_SERVICE_URL: "http://auth.atfq-apps.svc.cluster.local:8080"
  USER_SERVICE_URL: "http://user.atfq-apps.svc.cluster.local:8080"
  WIKI_SERVICE_URL: "http://wiki.atfq-apps.svc.cluster.local:8080"

envFrom:
  - secretRef:
      name: api-gateway-runtime-env

configMaps:
  - name: api-gateway-vault-agent-config
    data:
      agent-config.hcl: |-
        exit_after_auth = false
        pid_file = "/tmp/vault-agent-pid"

        auto_auth {
          method "approle" {
            config = {
              role_id_file_path = "/etc/vault/agent_ids/role-id"
              secret_id_file_path = "/etc/vault/agent_ids/secret-id"
              remove_secret_id_file_after_reading = false
            }
          }

          sink "file" {
            config = {
              path = "/tmp/token"
            }
          }
        }

        template {
          contents = <<EOH
        {{ with secret "secret/data/api-gateway" }}
        SERVER_ADDR="{{ .Data.data.server_addr }}"
        JWT_SECRET="{{ .Data.data.jwt_secret }}"
        AUTH_DATABASE_URL="postgresql://{{ .Data.data.auth_db_user }}:{{ .Data.data.auth_db_password }}@db-auth.atfq-data.svc.cluster.local:5432/{{ .Data.data.auth_db_name }}"
        USER_DATABASE_URL="postgresql://{{ .Data.data.user_db_user }}:{{ .Data.data.user_db_password }}@db-user.atfq-data.svc.cluster.local:5432/{{ .Data.data.user_db_name }}"
        {{ end }}
        EOH
          destination = "/vault/secrets/.env"
        }

volumeMounts:
  - name: vault-secrets
    mountPath: /vault/secrets
    readOnly: true

volumes:
  - name: vault-secrets
    emptyDir:
      medium: Memory
  - name: vault-agent-config
    configMap:
      name: api-gateway-vault-agent-config
  - name: vault-agent-ids
    secret:
      secretName: vault-agent-api-gateway-approle

sidecars:
  - name: vault-agent
    image: hashicorp/vault:1.13.3
    securityContext:
      runAsUser: 100
      runAsGroup: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
    env:
      - name: VAULT_ADDR
        value: http://vault.atfq-data.svc.cluster.local:8200
    command: ["vault", "agent", "-config=/etc/vault/agent-config.hcl"]
    volumeMounts:
      - name: vault-agent-config
        mountPath: /etc/vault/agent-config.hcl
        subPath: agent-config.hcl
      - name: vault-agent-ids
        mountPath: /etc/vault/agent_ids
        readOnly: true
      - name: vault-secrets
        mountPath: /vault/secrets

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 30
  periodSeconds: 20
