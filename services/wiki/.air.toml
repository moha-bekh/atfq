root = "."
tmp_dir = "tmp"

[build]
# Just build the main.go
cmd = "go build -o ./tmp/main ."
# Binary name generated from the cmd above
bin = "./tmp/main"
# Watch these extensions
include_ext = ["go", "tpl", "tmpl", "html"]
# Ignore these directories
exclude_dir = ["assets", "tmp", "vendor"]
# Delay after saving a file
delay = 1000 # ms
# Stop on error
stop_on_error = true

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"
