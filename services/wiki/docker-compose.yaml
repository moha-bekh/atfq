volumes:
  wiki-postgres_data:

services:
  # SERVICE
  wiki:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    networks:
      - backend
    depends_on:
      db-wiki:
        condition: service_healthy
    restart: unless-stopped
  # ------------------------------
  # DATABASE
  db-wiki:
    image: postgres:16-alpine
    networks:
      - backend
    volumes:
      - type: volume
        source: wiki-postgres_data
        target: /var/lib/postgresql/data
    # ports:
    # - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
