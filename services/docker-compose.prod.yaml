services:
  net-gateway:
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  app:
    build:
      target: prod
    restart: always
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api-gateway:
    build:
      target: prod
    restart: always
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  auth:
    build:
      target: prod
    restart: always
    environment:
      - REDIS_URL=redis://redis-auth:6379
      - METRICS_ADDR=0.0.0.0:9091
      - USER_SERVICE_ADDR=http://user:8080
      - STARTUP_MAX_RETRIES=90
      - APP_PUBLIC_URL=https://atfq.org
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_TLS=${SMTP_TLS:-false}
      - SMTP_FROM=${SMTP_FROM:-ATFQ <noreply@atfq.org>}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  user:
    build:
      target: prod
    restart: always
    ports: !reset []
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  wiki:
    build:
      target: prod
    restart: always
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  db-auth:
    restart: always
    ports: !reset []

  redis-auth:
    restart: always
    ports: !reset []

  mailpit:
    restart: always
    ports: !reset []

  db-user:
    restart: always
    ports: !reset []

  minio:
    restart: always
    ports: !reset []

  db-wiki:
    restart: always
    ports: !reset []

  vault:
    restart: always
    ports: !reset []

  prometheus:
    ports: !reset []

  cadvisor:
    ports: !reset []
