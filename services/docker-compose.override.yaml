volumes:
  cargo-cache:
  auth-target-cache:
  api-gateway-target-cache:

services:
  api-gateway:
    build:
      target: dev
    command: >
      sh -c "
      until [ -s /vault/secrets/.env ]; do
        echo 'Waiting for Vault Agent to write secrets...';
        sleep 1;
      done;
      set -a;
      . /vault/secrets/.env;
      set +a;
      exec cargo run"
    ports:
      - "8081:8080"
    volumes:
      - type: bind
        source: ./api-gateway
        target: /app
        consistency: cached
      - type: bind
        source: ./auth/proto/auth
        target: /app/proto/auth
      - type: bind
        source: ./user/proto/user
        target: /app/proto/user
      - type: volume
        source: cargo-cache
        target: /usr/local/cargo/registry
      - type: volume
        source: api-gateway-target-cache
        target: /app/target
  app:
    build:
      target: dev
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ./app
        target: /app
      - type: volume
        target: /app/node_modules
  auth:
    build:
      target: dev
    command: >
      sh -c "
      until [ -s /vault/secrets/.env ]; do
        echo 'Waiting for Vault Agent to write secrets...';
        sleep 1;
      done;
      set -a;
      . /vault/secrets/.env;
      set +a;
      exec cargo-watch -x run"
    ports:
      - "8082:8080"
    volumes:
      - type: bind
        source: ./auth
        target: /app
        consistency: cached
      - type: volume
        source: cargo-cache
        target: /usr/local/cargo/registry
      - type: volume
        source: auth-target-cache
        target: /app/target
  user:
    build:
      target: dev
    command: >
      sh -c "
      until [ -s /vault/secrets/.env ]; do
        echo 'Waiting for Vault Agent to write secrets...';
        sleep 1;
      done;
      set -a;
      . /vault/secrets/.env;
      set +a;
      exec cargo-watch -x run"
    ports:
      - "8083:8080"
    volumes:
      - type: bind
        source: ./user
        target: /app
        consistency: cached
      - type: volume
        target: /app/node_modules
  wiki:
    build:
      target: dev
    ports:
      - "8084:8080"
    volumes:
      - type: bind
        source: ./wiki
        target: /app
        consistency: cached
