volumes:
  auth-postgres_data:
  auth-shared-secrets:
    name: vault-auth-shared-secrets
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=770"

services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    networks:
      - backend
    volumes:
      - type: volume
        source: auth-shared-secrets
        target: /vault/secrets
        read_only: true
    environment:
      - REDIS_URL=redis://redis-auth:6379
      - METRICS_ADDR=0.0.0.0:9091
      - USER_SERVICE_ADDR=http://user:8080
      - STARTUP_MAX_RETRIES=90
      - APP_PUBLIC_URL=http://localhost:8080
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_TLS=false
      - SMTP_FROM=ATFQ <noreply@atfq.dev>
    depends_on:
      db-auth:
        condition: service_healthy
      redis-auth:
        condition: service_started
      mailpit:
        condition: service_started
      vault-agent-auth:
        condition: service_healthy
    restart: unless-stopped
  db-auth:
    image: postgres:16-alpine
    container_name: db-auth
    networks:
      - backend
    depends_on:
      vault-agent-auth:
        condition: service_healthy
    environment:
      - POSTGRES_USER_FILE=/vault/secrets/POSTGRES_USER
      - POSTGRES_PASSWORD_FILE=/vault/secrets/POSTGRES_PASSWORD
      - POSTGRES_DB_FILE=/vault/secrets/POSTGRES_DB
    volumes:
      - type: volume
        source: auth-postgres_data
        target: /var/lib/postgresql/data
      - type: volume
        source: auth-shared-secrets
        target: /vault/secrets
        read_only: true
    ports:
      - "127.0.0.1:5432:5432"
    command: >
      sh -c "
      until [ -s /vault/secrets/POSTGRES_PASSWORD ]; do
        echo 'Waiting for Vault Agent to write secrets...';
        sleep 1;
      done;
      echo 'Secrets found, starting Postgres...';
      exec docker-entrypoint.sh postgres"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $(cat /vault/secrets/POSTGRES_USER) -d $(cat /vault/secrets/POSTGRES_DB)",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
  redis-auth:
    image: redis:alpine
    container_name: redis-auth
    networks:
      - backend
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit-auth
    networks:
      - backend
    ports:
      - "127.0.0.1:8025:8025"
  vault-agent-auth:
    image: hashicorp/vault:1.13.3
    container_name: vault-agent-auth
    init: true
    networks:
      - backend
    environment:
      - VAULT_ADDR=http://vault:8200
    depends_on:
      vault:
        condition: service_started
    volumes:
      - type: bind
        source: ./vault/agent-auth.hcl
        target: /etc/vault/agent-config.hcl
      - type: bind
        source: ./vault/agent_ids
        target: /etc/vault/agent_ids
        read_only: true
      - type: volume
        source: auth-shared-secrets
        target: /vault/secrets
    cap_add:
      - IPC_LOCK
    restart: unless-stopped
    user: "root"
    command: >
      sh -c "chown -R vault:vault /vault/secrets && chmod 755 /vault/secrets && exec su-exec vault vault agent -config=/etc/vault/agent-config.hcl"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /vault/secrets/.env && test -s /vault/secrets/POSTGRES_USER && test -s /vault/secrets/POSTGRES_PASSWORD && test -s /vault/secrets/POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
