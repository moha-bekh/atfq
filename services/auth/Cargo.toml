[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
tokio = { version = "1.37", features = ["full"] }
# On force tonic 0.12.3 qui est compatible avec prost 0.13
tonic = "0.12.3"
prost = "0.13"
prost-types = "0.13"
tonic-reflection = "0.12.3"

dotenvy = "0.15"

serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.7", features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "chrono",
] }

uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

thiserror = "1.0"
argon2 = "0.5"
jsonwebtoken = "9.3"

tower = "0.5"
futures-util = "0.3"
pin-project = "1.1"
http = "1.0"

redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
rand = "0.10.1"
base32 = "0.5.1"
chacha20poly1305 = "0.10.1"
totp-rs = "5.7.1"

oauth2 = "4.4"
reqwest = { version = "0.11", features = ["json"] }

[build-dependencies]
tonic-build = "0.12.3"
