version: "3"

vars:
  COMPOSE_PROD: -f docker-compose.yaml -f docker-compose.prod.yaml
  GH_USER: "moha-bekh"
  REGISTRY: ghcr.io
  VERSION: '{{.VERSION | default "latest"}}'
  TARGET: '{{.TARGET | default "prod"}}'

includes:
  auth:
    taskfile: ./auth/Taskfile.yaml
    dir: ./auth
  app:
    taskfile: ./app/Taskfile.yaml
    dir: ./app
  user:
    taskfile: ./user/Taskfile.yaml
    dir: ./user
  wiki:
    taskfile: ./wiki/Taskfile.yaml
    dir: ./wiki
  net-gateway:
    taskfile: ./net-gateway/Taskfile.yaml
    dir: ./net-gateway
  vault:
    taskfile: ./vault/Taskfile.yaml
    dir: ./vault

  docker:
    taskfile: ./tasks/Taskcompose.yaml
    aliases: [dc]
  img:
    taskfile: ./tasks/Taskregistry.yaml

tasks:
  list-files:
    desc: "List project files excluding noise"
    cmds:
      - (cd {{.CLI_ARGS}} && tree -I "target|node_modules|.git|.cargo-ok|.step")

  auth-up:
    cmds:
      - task dc:up -- auth -d
      - sleep 5
      - task auth:migrate-run
      - task auth:offline-prepare
      - task dc:up -- api-gateway app net-gateway -d

  prod-build:
    desc: "Build production images"
    cmds:
      - task dc:prod-build

  prod-up:
    desc: "Initialize Vault, provision secrets and start the production stack"
    cmds:
      - task dc:prod

  first-up:
    desc: "Clean all local infra data, then start the production stack"
    cmds:
      - task dc:clean
      - task: prod-up

  up:
    desc: "Start the production stack"
    cmds:
      - task: prod-up
