syntax = "proto3";

package auth.v1;

enum OAuthProvider {
  GOOGLE = 0;
  GITHUB = 1;
}

message OAuthUrlRequest {
  OAuthProvider provider = 1;
  optional string linking_user_id = 2;
}

message OAuthUrlResponse {
  string url = 1;
}

message OAuthCallbackRequest {
  OAuthProvider provider = 1;
  string code = 2;
  string state = 3;
}
