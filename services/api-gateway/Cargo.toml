[package]
name = "api-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
# On force tonic 0.12.3 qui est compatible avec prost 0.13
tonic = "0.12.3"
prost = "0.13"
utoipa = { version = "4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }

[build-dependencies]
# Important : Aligne aussi le build-script
tonic-build = "0.12.3"
