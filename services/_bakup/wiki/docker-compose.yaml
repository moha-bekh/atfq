networks:
  atfq-net:
    driver: bridge

volumes:
  wiki-postgres_data:

services:
  wiki:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    init: true
    networks:
      - atfq-net
    env_file:
      - ./.env.wiki
    volumes:
      # Secrets (env)
      - type: bind
        source: ./.env.wiki
        target: /vault/secrets/config
        read_only: true
    ports:
      - "8083:8080"
    depends_on:
      db-wiki:
        condition: service_healthy
  # ---------------------------------------------------------------------------
  db-wiki:
    image: postgres:16-alpine
    networks:
      - atfq-net
    env_file:
      - ./.env.db
    volumes:
      - type: volume
        source: wiki-postgres_data
        target: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki_user -d docs_db"]
      interval: 5s
      timeout: 5s
      retries: 5
