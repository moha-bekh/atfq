volumes:
  user-postgres_data:
  user-minio_data:
  user-shared-secrets:
    name: vault-user-shared-secrets
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=770"

services:
  user:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    networks:
      - backend
    volumes:
      - type: volume
        source: user-shared-secrets
        target: /vault/secrets
        read_only: true
    environment:
      - METRICS_ADDR=0.0.0.0:9091
    depends_on:
      db-user:
        condition: service_healthy
      minio:
        condition: service_started
      create-buckets:
        condition: service_completed_successfully
      vault-agent-user:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8083:8080"
  db-user:
    image: postgres:16-alpine
    container_name: db-user
    networks:
      - backend
    depends_on:
      vault-agent-user:
        condition: service_healthy
    environment:
      - POSTGRES_USER_FILE=/vault/secrets/POSTGRES_USER
      - POSTGRES_PASSWORD_FILE=/vault/secrets/POSTGRES_PASSWORD
      - POSTGRES_DB_FILE=/vault/secrets/POSTGRES_DB
    volumes:
      - type: volume
        source: user-postgres_data
        target: /var/lib/postgresql/data
      - type: volume
        source: user-shared-secrets
        target: /vault/secrets
        read_only: true
    ports:
      - "127.0.0.1:5433:5432"
    command: >
      sh -c "
      until [ -s /vault/secrets/POSTGRES_PASSWORD ]; do
        echo 'Waiting for Vault Agent to write secrets...';
        sleep 1;
      done;
      echo 'Secrets found, starting Postgres...';
      exec docker-entrypoint.sh postgres"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $(cat /vault/secrets/POSTGRES_USER) -d $(cat /vault/secrets/POSTGRES_DB)",
        ]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 2m
  minio:
    image: minio/minio
    container_name: minio-user
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER_FILE: /vault/secrets/MINIO_ROOT_USER
      MINIO_ROOT_PASSWORD_FILE: /vault/secrets/MINIO_ROOT_PASSWORD
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - type: volume
        source: user-minio_data
        target: /data
      - type: volume
        source: user-shared-secrets
        target: /vault/secrets
        read_only: true
    networks:
      - backend
    depends_on:
      vault-agent-user:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until [ -s /vault/secrets/MINIO_ROOT_USER ] && [ -s /vault/secrets/MINIO_ROOT_PASSWORD ]; do
        echo 'Waiting for Vault Agent to write MinIO secrets...';
        sleep 1;
      done;
      exec minio server /data --console-address ':9001'"
    restart: unless-stopped

  create-buckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
      vault-agent-user:
        condition: service_healthy
    networks:
      - backend
    volumes:
      - type: volume
        source: user-shared-secrets
        target: /vault/secrets
        read_only: true
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 $$(cat /vault/secrets/MINIO_ROOT_USER) $$(cat /vault/secrets/MINIO_ROOT_PASSWORD);
      /usr/bin/mc mb myminio/$$(cat /vault/secrets/S3_BUCKET) || echo 'Bucket already exists';
      /usr/bin/mc anonymous set public myminio/$$(cat /vault/secrets/S3_BUCKET);
      echo 'Buckets created successfully';
      exit 0;
      "
  vault-agent-user:
    image: hashicorp/vault:1.13.3
    container_name: vault-agent-user
    init: true
    networks:
      - backend
    environment:
      - VAULT_ADDR=http://vault:8200
    depends_on:
      vault:
        condition: service_started
    volumes:
      - type: bind
        source: ./vault/agent-user.hcl
        target: /etc/vault/agent-config.hcl
      - type: bind
        source: ./vault/agent_ids
        target: /etc/vault/agent_ids
        read_only: true
      - type: volume
        source: user-shared-secrets
        target: /vault/secrets
    cap_add:
      - IPC_LOCK
    restart: unless-stopped
    user: "root"
    command: >
      sh -c "chown -R vault:vault /vault/secrets && chmod 755 /vault/secrets && exec su-exec vault vault agent -config=/etc/vault/agent-config.hcl"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /vault/secrets/.env && test -s /vault/secrets/POSTGRES_USER && test -s /vault/secrets/POSTGRES_PASSWORD && test -s /vault/secrets/POSTGRES_DB && test -s /vault/secrets/MINIO_ROOT_USER && test -s /vault/secrets/MINIO_ROOT_PASSWORD && test -s /vault/secrets/S3_BUCKET",
        ]
      interval: 5s
      timeout: 10s
      retries: 120
      start_period: 2m
