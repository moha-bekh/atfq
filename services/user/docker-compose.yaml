volumes:
  user-postgres_data:

services:
  # SERVICE
  user:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    networks:
      - backend
    env_file:
      - ./.env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-user:5432/${POSTGRES_DB}"
    ports:
      - "8080:8080"
      - "50051:50051"
    depends_on:
      db-user:
        condition: service_healthy
    restart: unless-stopped

  # DATABASE
  db-user:
    image: postgres:16-alpine
    networks:
      - backend
    volumes:
      - type: volume
        source: user-postgres_data
        target: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=atfq_db
      - POSTGRES_USER=atfq
      - POSTGRES_PASSWORD=atfq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  backend:
    driver: bridge
