volumes:
  user-postgres_data:

services:
  # SERVICE
  user:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    networks:
      - backend
    env_file:
      - ./.env
    # ports:
    #   - "$PORT:8080"
    depends_on:
      db-user:
        condition: service_healthy
    restart: unless-stopped
  # ------------------------------
  # DATABASE
  db-user:
    image: postgres:16-alpine
    networks:
      - backend
    env_file:
      - ./.env
    volumes:
      - type: volume
        source: user-postgres_data
        target: /var/lib/postgresql/data
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
