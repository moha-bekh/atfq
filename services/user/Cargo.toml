[package]
name = "user"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
tonic = { version = "0.11", features = ["transport"] }
prost = "0.12"
tonic-reflection = "0.11"
prost-types = "0.12"
dotenvy = "0.15"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "chrono",
] }

uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

aws-config = "1.1"
aws-sdk-s3 = "1.17"

jsonwebtoken = "9.3"
tower = "0.4"
futures-util = "0.3"
pin-project = "1.1"
http = "0.2"

[build-dependencies]
tonic-build = "0.11"
