global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: "auth"
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:9091"]

  - job_name: "user"
    metrics_path: /metrics
    static_configs:
      - targets: ["user:9091"]

  - job_name: "wiki"
    metrics_path: /metrics
    static_configs:
      - targets: ["wiki:9091"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "process-exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["process-exporter:9256"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
