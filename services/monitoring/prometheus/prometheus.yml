global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "node-exporter"
    static_configs:
      - targets: ["monitoring-node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["monitoring-cadvisor:8080"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["monitoring-prometheus:9090"]

  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: "auth-service"
    static_configs:
      - targets: ["auth:8080"]
